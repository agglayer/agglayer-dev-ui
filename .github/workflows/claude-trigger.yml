name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    uses: 0xPolygon/pipelines/.github/workflows/apps-claude.yml@04f6373c6a0197562386116d2c1b0f4139be18e7 # main 2026-11-17
    secrets:
      CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
