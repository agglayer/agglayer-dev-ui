name: E2E Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # TEMPORARY -- remove per plans/dev-ui-docker-ghcr/d2-adr-dependency-strategy.md §5
  # Same pin as docker-pr.yaml/docker-publish.yaml (SDK_REF drift across all
  # three workflows would be silently misleading: a green e2e run would
  # prove nothing about the @agglayer/sdk revision docker-pr.yaml/
  # docker-publish.yaml actually build against). Verified identical across
  # local HEAD, `git ls-remote`, and
  # `gh api repos/agglayer/sdk/pulls/28 --jq .head.sha` as of the D-2 ADR
  # (2026-08-11). Bump this alongside the other two workflows' SDK_REF
  # entries; delete entirely once the D-2 ADR §5 migration trigger fires.
  SDK_REF: 5680d837b168cd3b250110660332aa110eb88aae

jobs:
  e2e:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    env:
      CI: true
      E2E_PRIVATE_KEY: ${{ secrets.E2E_PRIVATE_KEY }}
      NEXT_PUBLIC_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_PROJECT_ID }}
      NEXT_PUBLIC_AGGKIT_BRIDGE_APIS: ${{ secrets.NEXT_PUBLIC_AGGKIT_BRIDGE_APIS }}
    steps:
      # Checked out into a subdirectory (not repo root) so a sibling
      # agglayer/sdk checkout below can sit next to it at `../sdk` --
      # exactly the relative shape pnpm-workspace.yaml's
      # `'@agglayer/sdk': 'file:../sdk'` override expects locally. Every
      # subsequent step below runs with `working-directory: dev-ui`.
      - name: Checkout agglayer-dev-ui
        uses: actions/checkout@v4
        with:
          path: dev-ui
          fetch-depth: 0
          persist-credentials: false

      # TEMPORARY -- remove per plans/dev-ui-docker-ghcr/d2-adr-dependency-strategy.md §5
      # A second, SHA-pinned checkout of the public agglayer/sdk repo,
      # staged as a TRUE sibling of dev-ui/ (path: sdk, not nested inside
      # it) so pnpm-workspace.yaml's `file:../sdk` override resolves
      # (dev-ui/../sdk == this checkout). This differs from
      # docker-pr.yaml/docker-publish.yaml's `.sdk-src` staging: those stage
      # sdk INSIDE the dev-ui Docker build context because a Docker build
      # context can't reach outside itself, but a plain `pnpm install` has
      # no such constraint, so this sibling layout matches what a local dev
      # checkout actually looks like. agglayer/sdk is public
      # (`gh repo view agglayer/sdk --json isPrivate` -> {"isPrivate":false}),
      # so the default GITHUB_TOKEN suffices -- no PAT, no new secret.
      - name: Checkout agglayer/sdk (pinned, TEMPORARY)
        uses: actions/checkout@v4
        with:
          repository: agglayer/sdk
          ref: ${{ env.SDK_REF }}
          path: sdk
          persist-credentials: false

      # Mirrors docker-pr.yaml's parity check against docker-publish.yaml:
      # left unguarded, a one-sided SDK_REF bump here would let this job
      # install/test against a different @agglayer/sdk revision than the
      # one actually published, so a green e2e run would prove nothing
      # about the shipped image's SDK revision.
      # TEMPORARY -- remove per plans/dev-ui-docker-ghcr/d2-adr-dependency-strategy.md §5
      - name: Assert SDK_REF matches docker-publish.yaml
        working-directory: dev-ui
        run: |
          set -euo pipefail
          publish_ref="$(grep -oE '^  SDK_REF: [0-9a-f]{40}$' .github/workflows/docker-publish.yaml | awk '{print $2}')"
          if [ -z "$publish_ref" ]; then
            echo "::error::could not read a 40-char SDK_REF from .github/workflows/docker-publish.yaml -- keep every workflow's SDK_REF entry in the documented 'SDK_REF: <40 hex chars>' form" >&2
            exit 1
          fi
          if [ "$publish_ref" != "$SDK_REF" ]; then
            echo "::error::SDK_REF drift: e2e.yaml pins '$SDK_REF' but docker-publish.yaml pins '$publish_ref'. Bump both together (see docker-pr.yaml's identical check)." >&2
            exit 1
          fi
          echo "SDK_REF in sync with docker-publish.yaml: $SDK_REF"

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: dev-ui/.nvmrc
          cache: pnpm
          cache-dependency-path: dev-ui/pnpm-lock.yaml

      # With the sibling sdk/ checkout above in place, pnpm-workspace.yaml's
      # `file:../sdk` override resolves and this no longer fails with
      # ENOENT scandir '<work>/dev-ui/../sdk' the way the pre-restructure
      # single-directory checkout did.
      - name: Install dependencies
        working-directory: dev-ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: dev-ui
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright preflight
        working-directory: dev-ui
        run: pnpm exec playwright test tests/e2e/preflight.spec.ts

      - name: Run Playwright bridge tests
        working-directory: dev-ui
        run: pnpm exec playwright test tests/bridge

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            dev-ui/playwright-report
            dev-ui/test-results
          retention-days: 30
          if-no-files-found: ignore
