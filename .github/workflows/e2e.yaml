name: E2E Playwright Tests

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # TEMPORARY -- remove per plans/dev-ui-docker-ghcr/d2-adr-dependency-strategy.md §5
  # Same pin as docker-pr.yaml/docker-publish.yaml (SDK_REF drift across all
  # three workflows would be silently misleading: a green e2e run would
  # prove nothing about the @agglayer/sdk revision docker-pr.yaml/
  # docker-publish.yaml actually build against). Verified identical across
  # local HEAD, `git ls-remote`, and
  # `gh api repos/agglayer/sdk/pulls/28 --jq .head.sha` as of the D-2 ADR
  # (2026-08-11). Bump this alongside the other two workflows' SDK_REF
  # entries; delete entirely once the D-2 ADR §5 migration trigger fires.
  SDK_REF: 5680d837b168cd3b250110660332aa110eb88aae

jobs:
  e2e:
    runs-on: ubuntu-latest
    # Budget: devnet compose boot-to-ready measured ~24s (kurtosis-cdk S10/
    # S11), install+browsers a few minutes, preflight seconds, then the full
    # bridge suite -- L2->L1 certificate settlement is the slow, variable
    # leg (~3.5min typical per kurtosis-cdk plan measurements, retry counts
    # vary run-to-run). 75 minutes pads generously over the observed happy
    # path for a loaded runner.
    timeout-minutes: 75
    env:
      CI: true
      # Devnet is hermetic and vendored (tests/devnet/, see its README) --
      # every value below is either a well-known public devnet fixture (the
      # E2E signer key is a public Kurtosis/Foundry devnet key, funded only
      # on the ephemeral compose bundle this job brings up itself) or a
      # literal computed from that same bundle's tests/devnet/summary.json.
      # None of these are repository secrets: nothing here grants access to
      # anything outside this job's own throwaway containers.
      E2E_PRIVATE_KEY: '0x12d7de8621a77640c9241b2595ba78ce443d05e94090365ab3bb5e19df82c625'
      NEXT_PUBLIC_PROJECT_ID: ci-e2e
      NEXT_PUBLIC_AGGKIT_BRIDGE_APIS: '{"1":"http://127.0.0.1:8555/aggkitapi","2":"http://127.0.0.1:8555/aggkitapi"}'
      E2E_FROM_CHAIN_ID: '271828'
      E2E_TO_CHAIN_ID: '20201'
      E2E_L2_CHAIN_IDS: '20201,20202'
      # From tests/devnet/summary.json's .erc20_address -- nonce-dependent,
      # bump alongside tests/devnet/docker-compose.yml (see its README).
      E2E_ERC20_ADDRESS: '0xe293A6b8F558422813499bb5C89B60adD8c54636'
    steps:
      # Checked out into a subdirectory (not repo root) so a sibling
      # agglayer/sdk checkout below can sit next to it at `../sdk` --
      # exactly the relative shape pnpm-workspace.yaml's
      # `'@agglayer/sdk': 'file:../sdk'` override expects locally. Every
      # subsequent step below runs with `working-directory: dev-ui`.
      - name: Checkout agglayer-dev-ui
        uses: actions/checkout@v4
        with:
          path: dev-ui
          fetch-depth: 0
          persist-credentials: false

      # TEMPORARY -- remove per plans/dev-ui-docker-ghcr/d2-adr-dependency-strategy.md §5
      # A second, SHA-pinned checkout of the public agglayer/sdk repo,
      # staged as a TRUE sibling of dev-ui/ (path: sdk, not nested inside
      # it) so pnpm-workspace.yaml's `file:../sdk` override resolves
      # (dev-ui/../sdk == this checkout). This differs from
      # docker-pr.yaml/docker-publish.yaml's `.sdk-src` staging: those stage
      # sdk INSIDE the dev-ui Docker build context because a Docker build
      # context can't reach outside itself, but a plain `pnpm install` has
      # no such constraint, so this sibling layout matches what a local dev
      # checkout actually looks like. agglayer/sdk is public
      # (`gh repo view agglayer/sdk --json isPrivate` -> {"isPrivate":false}),
      # so the default GITHUB_TOKEN suffices -- no PAT, no new secret.
      - name: Checkout agglayer/sdk (pinned, TEMPORARY)
        uses: actions/checkout@v4
        with:
          repository: agglayer/sdk
          ref: ${{ env.SDK_REF }}
          path: sdk
          persist-credentials: false

      # Mirrors docker-pr.yaml's parity check against docker-publish.yaml:
      # left unguarded, a one-sided SDK_REF bump here would let this job
      # install/test against a different @agglayer/sdk revision than the
      # one actually published, so a green e2e run would prove nothing
      # about the shipped image's SDK revision.
      # TEMPORARY -- remove per plans/dev-ui-docker-ghcr/d2-adr-dependency-strategy.md §5
      - name: Assert SDK_REF matches docker-publish.yaml
        working-directory: dev-ui
        run: |
          set -euo pipefail
          publish_ref="$(grep -oE '^  SDK_REF: [0-9a-f]{40}$' .github/workflows/docker-publish.yaml | awk '{print $2}')"
          if [ -z "$publish_ref" ]; then
            echo "::error::could not read a 40-char SDK_REF from .github/workflows/docker-publish.yaml -- keep every workflow's SDK_REF entry in the documented 'SDK_REF: <40 hex chars>' form" >&2
            exit 1
          fi
          if [ "$publish_ref" != "$SDK_REF" ]; then
            echo "::error::SDK_REF drift: e2e.yaml pins '$SDK_REF' but docker-publish.yaml pins '$publish_ref'. Bump both together (see docker-pr.yaml's identical check)." >&2
            exit 1
          fi
          echo "SDK_REF in sync with docker-publish.yaml: $SDK_REF"

      # TEMPORARY -- remove per plans/dev-ui-docker-ghcr/d2-adr-dependency-strategy.md §5
      # @agglayer/sdk ships no dist/ in git (bun.lock only -- dist/ is
      # gitignored, built via `bun run build` / tsup), so a fresh checkout is
      # unbuildable TypeScript source until this runs: the sibling sdk/
      # `file:../sdk` override resolves the package.json entry (`main:
      # ./dist/index.js`), not the source tree. Without this step Next's dev
      # server fails every route with "Module not found: Can't resolve
      # '@agglayer/sdk'" -- caught only by a genuine scratch-clone rehearsal
      # (plans/dev-ui-ci-snapshot/s13-evidence/); a warm sibling sdk checkout
      # on a dev box masks it because its dist/ is already built from earlier
      # SDK development. Mirrors the Dockerfile's sdk-builder stage (`FROM
      # oven/bun:1 ... RUN bun install --frozen-lockfile && bun run build`)
      # bit-for-bit, just targeting this sibling checkout instead of a Docker
      # build context.
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1'

      - name: Build @agglayer/sdk (pinned, TEMPORARY)
        working-directory: sdk
        env:
          HUSKY: '0'
        run: |
          bun install --frozen-lockfile
          bun run build

      # Checkout lives at dev-ui/ (see the restructuring above), so the
      # default package_json_file: package.json (resolved against
      # $GITHUB_WORKSPACE) doesn't exist -- point it at the checkout's own
      # package.json (packageManager: pnpm@10.30.3) so version detection
      # works. Same subdir pattern as actions/setup-node's
      # node-version-file: dev-ui/.nvmrc below.
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: dev-ui/package.json

      - uses: actions/setup-node@v4
        with:
          node-version-file: dev-ui/.nvmrc
          cache: pnpm
          cache-dependency-path: dev-ui/pnpm-lock.yaml

      # With the sibling sdk/ checkout above in place, pnpm-workspace.yaml's
      # `file:../sdk` override resolves and this no longer fails with
      # ENOENT scandir '<work>/dev-ui/../sdk' the way the pre-restructure
      # single-directory checkout did.
      - name: Install dependencies
        working-directory: dev-ui
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: dev-ui
        run: pnpm exec playwright install --with-deps chromium

      # Vendored self-contained bundle -- tests/devnet/docker-compose.yml,
      # see tests/devnet/README.md. No bind mounts/volumes, no kurtosis CLI,
      # 11 public GHCR images pinned by immutable sha tag. `--wait` blocks
      # until every service's own healthcheck passes (see the compose file),
      # which is necessary but not sufficient -- aggkit can be "healthy" and
      # still mid-sync, hence the dedicated readiness gate below.
      - name: Start vendored devnet
        working-directory: dev-ui
        run: docker compose -f tests/devnet/docker-compose.yml up -d --wait

      # Replicates kurtosisDevnetEnv.mjs's live-enclave probes against the
      # fixed compose ports (no kurtosis CLI dependency) -- see
      # scripts/devnetReady.mjs for the exact checks. Timeout padded well
      # above the ~24s measured boot-to-ready (kurtosis-cdk S10/S11) for a
      # loaded runner.
      - name: Wait for devnet readiness
        working-directory: dev-ui
        run: node scripts/devnetReady.mjs --timeout-ms 300000 --interval-ms 3000

      # config.json ships committed in testnet mode (see README.md#testing);
      # this CI fixture flips appModes.default to devnet with the vendored
      # bundle's fixed 127.0.0.1:8555 URLs already baked in.
      - name: Configure devnet fixture
        working-directory: dev-ui
        run: |
          cp config/config.ci.devnet.json config.json
          pnpm run validate:config

      - name: Run Playwright preflight
        working-directory: dev-ui
        run: pnpm exec playwright test tests/e2e/preflight.spec.ts

      - name: Run Playwright bridge tests
        working-directory: dev-ui
        run: pnpm exec playwright test tests/bridge

      # if: always() (not !cancelled()/on-failure) -- a hung devnet that
      # causes the job to be cancelled on timeout is exactly the case where
      # these logs matter most.
      - name: Dump devnet logs
        if: always()
        working-directory: dev-ui
        run: docker compose -f tests/devnet/docker-compose.yml logs --no-color > devnet-compose.log || true

      - name: Tear down devnet
        if: always()
        working-directory: dev-ui
        run: docker compose -f tests/devnet/docker-compose.yml down -v || true

      - name: Upload Playwright artifacts
        uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report-${{ github.run_id }}
          path: |
            dev-ui/playwright-report
            dev-ui/test-results
            dev-ui/devnet-compose.log
          retention-days: 30
          if-no-files-found: ignore
