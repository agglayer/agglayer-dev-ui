blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - '@polygonlabs/*'
  - '@maticnetwork/*'
  - '@agglayer/*'
  - '@0xsequence/*'
  - '@0xtrails/*'
overrides:
  '@wagmi/connectors': ^5.9.9
  # Security overrides: transitive dependencies whose parents still resolve
  # to vulnerable versions. Each one stays inside the major the parent asks
  # for. Remove an entry once the parent ships a patched range.
  '@babel/core@<7.29.6': ^7.29.6
  'axios@<1.20.0': ^1.20.0
  'baseline-browser-mapping@<2.11.0': ^2.11.0
  'brace-expansion@>=5.0.0 <5.0.12': ^5.0.12
  'browserslist@<4.28.7': ^4.28.7
  'fast-uri@<3.1.9': ^3.1.9
  'follow-redirects@<1.16.2': ^1.16.2
  'form-data@>=4.0.0 <4.0.6': ^4.0.6
  'hono@<4.13.16': ^4.13.16
  'js-yaml@>=4.0.0 <4.3.2': ^4.3.2
  'nanoid@>=3.0.0 <3.3.18': ^3.3.18
  'postcss@<8.5.23': ^8.5.23
  'socket.io-parser@>=4.0.0 <4.2.7': ^4.2.7
  'source-map-js@<1.2.2': ^1.2.2
  '@walletconnect/jsonrpc-ws-connection>ws': ^7.5.11
  'ws@>=8.0.0 <8.21.0': ^8.21.0
trustPolicy: no-downgrade
trustPolicyExclude:
  - 'undici-types@6.21.0'
  - 'eslint-import-resolver-typescript@3.10.1'
  - 'semver@6.3.1'
  - '@noble/curves@1.8.0'
  - '@noble/hashes@1.7.0'
  - 'slow-redact@0.3.2'
