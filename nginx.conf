# Static-export routing for the Next.js `output: 'export'` build (next.config.ts).
# Listens on port 80 (see Dockerfile EXPOSE).
server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # R7: the served config document must never be cached by a browser or an
    # intermediary proxy. A container restart with a different mounted
    # config.json must be reflected on the very next request -- entrypoint.sh
    # already guards against a stale file on disk, this guards against a
    # stale response in a cache. Belt-and-braces with app/configLoader.ts's
    # `cache: 'no-store'` fetch option (see a1-runtime-config-design.md §3.6).
    location = /config.json {
        add_header Cache-Control "no-store" always;
        try_files /config.json =404;
    }

    # Next's static export fingerprints every asset under _next/static/ by
    # content hash (the path changes whenever the content does), so these are
    # safe to cache forever.
    location /_next/static/ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Next's static export writes clean-URL routes as "<route>.html" (e.g.
    # out/transactions.html) rather than "<route>/index.html", so try_files
    # must probe the .html form before falling back to a directory index.
    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    error_page 404 /404.html;
}
